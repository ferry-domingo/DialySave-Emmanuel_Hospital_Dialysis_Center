services:
  - type: web
    name: dialysave
    runtime: node
    plan: free
    buildCommand: npm install --prefix frontend --include=dev && npm run build --prefix frontend && npm install --omit=dev --prefix backend
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.5
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
